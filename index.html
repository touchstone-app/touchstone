/* Touchstone — Calm Tide, friendly variant (design addendum §3) */
:root {
  --bg: #F1F5F8; --card: #FFFFFF; --tint: #E3EFF5; --ink: #14262F; --mute: #4A5F6B; --line: #D5E1E8; --acc: #2A6A88; --accInk: #FFFFFF; --deep: #1D4E66;
  --alert: #FFF3DC; --alertInk: #5A3D00; --support: #FCE8EC; --supportInk: #5E1426; --period: #C24F6A; --periodInk: #FFFFFF; --demo: #5B3C88; --demoInk: #FFFFFF;
  --s1: #5FB8A6; --s2: #A9D18E; --s3: #F2D36B; --s4: #EE9A4D; --s5: #C2413A; --danger: #B3261E; --sheet: rgba(20, 38, 47, .45);
  --hf: 'Fredoka', 'Nunito', system-ui, sans-serif; --bf: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0E181E; --card: #16242C; --tint: #1C3340; --ink: #E4EEF2; --mute: #A2B6C0; --line: #25373F; --acc: #7FC0DC; --accInk: #0E181E; --deep: #4E93B2;
  --alert: #3A2E12; --alertInk: #F6DFA6; --support: #3B1A24; --supportInk: #F8D3DC; --period: #E07A92; --periodInk: #1A0C10; --demo: #8F6CC4; --demoInk: #120B1C;
  --s1: #4E9E8E; --s2: #8DB574; --s3: #D6B955; --s4: #D4823C; --s5: #B23A34; --danger: #F2A49C; --sheet: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--bf); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: var(--acc); font-weight: 800; }
h1, h2, h3 { font-family: var(--hf); font-weight: 600; margin: 0; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
main.scr { flex: 1; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 16px; }
.muted { color: var(--mute); } .small { font-size: 14px; color: var(--mute); line-height: 1.45; } .tiny { font-size: 12px; color: var(--mute); }
.center { text-align: center; } .row { display: flex; align-items: center; gap: 8px; } .grow { flex: 1; min-width: 0; } .col { display: flex; flex-direction: column; gap: 8px; }
.label { font-family: var(--hf); font-size: 14px; font-weight: 600; letter-spacing: .02em; color: var(--mute); }
.h1sub { font-size: 15px; color: var(--mute); font-weight: 700; } .h1 { font-size: 32px; line-height: 1.15; }
.card { background: var(--card); border: 1.5px solid var(--line); box-shadow: 0 3px 0 var(--line); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.card.flat { border: 0; box-shadow: none; } .card.tint { background: var(--tint); border: 0; box-shadow: none; } .card.alertc { background: var(--alert); color: var(--alertInk); border: 0; box-shadow: none; }
.h2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; } .h2 h2 { font-size: 20px; } .h2 .l { display: flex; align-items: center; gap: 10px; }
.badge { width: 36px; height: 36px; flex: none; border-radius: 12px; background: var(--tint); color: var(--acc); display: flex; align-items: center; justify-content: center; }
.badge.sm { width: 28px; height: 28px; border-radius: 9px; background: var(--card); }
.btn { min-height: 48px; padding: 0 18px; border-radius: 18px; font-family: var(--hf); font-size: 17px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--card); color: var(--acc); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); transition: transform .12s ease, box-shadow .12s ease; text-decoration: none; }
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.btn.primary { background: var(--acc); color: var(--accInk); border: 0; box-shadow: 0 4px 0 var(--deep); } .btn.primary:active { box-shadow: 0 1px 0 var(--deep); }
.btn.ghost { background: transparent; border: 0; box-shadow: none; } .btn.big { min-height: 56px; } .btn.block { width: 100%; }
.btn.danger { color: var(--danger); border-color: var(--danger); box-shadow: 0 3px 0 var(--danger); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.iconbtn { width: 48px; height: 48px; flex: none; border-radius: 24px; border: 1.5px solid var(--line); box-shadow: 0 2px 0 var(--line); background: var(--card); color: var(--ink); display: flex; align-items: center; justify-content: center; }
.linkbtn { background: none; border: 0; padding: 0; min-height: 44px; color: var(--acc); font-weight: 800; display: inline-flex; align-items: center; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 4px 0; } .topbar h1 { flex: 1; text-align: center; font-size: 20px; } .topbar .sp { width: 48px; }
.progress { display: flex; flex-direction: column; gap: 8px; } .progress .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; } .progress .fill { height: 8px; border-radius: 4px; background: var(--acc); transition: width .4s cubic-bezier(.4, 0, .2, 1); }
